[workspace]
resolver = "3"
members = ["crates/macroport-core", "crates/macroport-cli", "crates/macroport-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/linagora/macro-port"
publish = false

# Versions and features come from docs/adr/0002-dependencies.md.
[workspace.dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
fluent-bundle = "0.16.0"
insta = { version = "1.49.0", features = ["glob", "yaml"] }
jsonschema = { version = "0.59.0", default-features = false }
macroport-core = { path = "crates/macroport-core" }
macroport-testkit = { path = "crates/macroport-testkit" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unic-langid = "0.9.6"

[workspace]
resolver = "3"
members = ["crates/macroport-core", "crates/macroport-cli", "crates/macroport-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/linagora/macro-port"
publish = false

# Versions and features come from docs/adr/0002-dependencies.md.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
jsonschema = { version = "0.59.0", default-features = false }
macroport-core = { path = "crates/macroport-core" }
macroport-testkit = { path = "crates/macroport-testkit" }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[workspace]
resolver = "3"
members = ["crates/macroport-core", "crates/macroport-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/linagora/macro-port"
publish = false

# Versions and features come from docs/adr/0002-dependencies.md.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }

# The core is pure (CLAUDE.md): no file system, network, console,
# environment, clock, randomness, threads or processes. These are the
# standard library's ways in, and the helpers of the `zip` crate that extract
# to disk; Cargo.toml turns the bans into errors, and the wasm32 build rejects
# the APIs of a single operating system. The cfb crate adds its own: it opens
# files by path, writes compound files and stamps them with the clock, while
# the core only opens a byte slice (ADR-0002).
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "randomly seeded: use a BTreeMap" },
    { path = "std::collections::HashSet", reason = "randomly seeded: use a BTreeSet" },
    { path = "std::fs::DirBuilder", reason = "the core does no I/O: bytes in, report out" },
    { path = "std::fs::File", reason = "the core does no I/O: bytes in, report out" },
    { path = "std::fs::OpenOptions", reason = "the core does no I/O: bytes in, report out" },
    { path = "std::fs::ReadDir", reason = "the core does no I/O: bytes in, report out" },
    { path = "std::hash::RandomState", reason = "randomly seeded: use a BTreeMap or a fixed hasher" },
    { path = "std::net::TcpListener", reason = "the core makes no network call" },
    { path = "std::net::TcpStream", reason = "the core makes no network call" },
    { path = "std::net::UdpSocket", reason = "the core makes no network call" },
    { path = "std::process::Command", reason = "the core runs nothing" },
    { path = "std::thread::Builder", reason = "the core starts no thread: the CLI parallelises" },
    { path = "std::time::Instant", reason = "the core reads no clock: the caller injects time values" },
    { path = "std::time::SystemTime", reason = "the core reads no clock: the caller injects time values" },
]


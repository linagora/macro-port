# Invalid: a trait label lacks its French text, another its English text, and a trait has no label.
version: 0.1.0

file_levels:
  medium:
    any:
      - { metric: logical_loc, gte: 150 }
      - { metric: forms, gte: 1 }
  high:
    any:
      - { metric: logical_loc, gte: 1000 }

metric_definitions:
  logical_loc: "Non-blank, non-comment lines, after joining line continuations."
  forms: "Number of UserForm modules."

traits:
  - { id: recorded_macro, description: "Typical of the macro recorder.",
      label: { en: "Recorded macro style" },
      any: [{ match: comment, pattern: 'macro recorded' },
            { match: procedure_name, pattern: ['^Macro\d+$'] },
            { match: ratio, of: [Select, ActiveCell], per_logical_loc_gte: 0.3 }] }
  - { id: trivial, description: "At most 3 logical lines.",
      all: [{ metric: logical_loc, lte: 3 }] }
  - { id: possibly_unused, description: "Never referenced from the project.",
      label: { fr: "Possiblement inutilisée" },
      structural: possibly_unused }
